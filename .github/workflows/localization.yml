name: Localization data
on:
  pull_request:
    paths:
      - 'Packages/**'
      - 'Tools/Localization/**'
      - 'Tools/InstallerLocalization/**'
      - 'Tools/Documentation/**'
      - 'README*.md'
      - '.github/workflows/localization.yml'
  workflow_dispatch:
jobs:
  translation-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python Tools/Localization/validate_catalogs.py
      - run: python Tools/Localization/audit_coverage.py --report localization-coverage.json
      - run: python Tools/Localization/audit_terminology.py --strict --report localization-terminology.json
      - run: python -m unittest discover -s Tools/Documentation -p test_documents.py
      - run: python Tools/Documentation/build_documents.py --products PosingSystem --check --report documentation-check.json
      - run: python Tools/Documentation/check_documents.py
      - run: python Tools/Documentation/audit_terminology.py --strict --report documentation-terminology.json
      - name: Verify generated setup helper
        run: |
          python Tools/InstallerLocalization/generate_language.py
          git diff --exit-code -- Packages/jp.unisakistudio.posingsystem/Editor/Setup/SetupLanguage.cs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localization-coverage
          path: |
            localization-*.json
            documentation-*.json
